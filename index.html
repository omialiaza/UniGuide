<style>
  :root{
    --navy:#0B1F3A;
    --blue:#1D4ED8;
    --blue-deep:#153FAE;
    --blue-tint:#EAF1FF;
    --white:#FFFFFF;
    --black:#0A0A0A;
    --steel:#5C6B84;
    --border:#DCE3F0;
    --bg:#F7F9FC;
    --radius:2px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--black);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ===== Header ===== */
  header{
    position:sticky; top:0; z-index:40;
    background:var(--white);
    border-bottom:1px solid var(--border);
    padding-top:env(safe-area-inset-top,0px);
  }
  .header-inner{
    max-width:1180px; margin:0 auto; padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .logo{
    display:flex; align-items:baseline; gap:8px; font-size:22px; font-weight:600; letter-spacing:-0.01em;
  }
  .logo .mark{
    display:inline-block; width:10px; height:10px; background:var(--blue); margin-right:2px; transform:translateY(-2px);
  }
  .lang-switch{
    display:flex; border:1px solid var(--border); overflow:hidden;
  }
  .lang-switch button{
    background:var(--white); border:none; padding:8px 13px; font-size:13px; font-weight:600;
    color:var(--steel); cursor:pointer; border-left:1px solid var(--border);
  }
  .lang-switch button:first-child{border-left:none;}
  .lang-switch button.active{background:var(--navy); color:var(--white);}
  .lang-switch button:hover:not(.active){background:var(--blue-tint); color:var(--navy);}

  /* ===== Hero ===== */
  .hero{
    background:var(--navy); color:var(--white);
    padding:56px 24px 64px;
  }
  .hero-inner{max-width:1180px; margin:0 auto;}
  .hero h1{
    font-size:clamp(32px,4.6vw,52px); font-weight:500; line-height:1.08; margin:0 0 18px; max-width:14ch;
    letter-spacing:-0.01em;
  }
  .hero p{
    font-size:17px; line-height:1.6; color:#C9D6EE; max-width:56ch; margin:0 0 34px;
  }
  .stat-row{display:flex; gap:0; flex-wrap:wrap; border-top:1px solid rgba(255,255,255,0.18);}
  .stat{
    padding:20px 28px 0 0; margin-right:28px; min-width:120px;
  }
  .stat .num{font-family:'Fraunces',serif; font-size:30px; font-weight:500; color:var(--white);}
  .stat .label{font-size:13px; color:#9FB2D6; margin-top:2px;}

  /* ===== Layout ===== */
  .layout{
    max-width:1180px; margin:0 auto; padding:40px 24px 90px;
    display:grid; grid-template-columns:280px 1fr; gap:36px; align-items:start;
  }
  @media (max-width:860px){
    .layout{grid-template-columns:1fr; padding:28px 18px 70px;}
  }

  /* ===== Filters ===== */
  .filters{
    background:var(--white); border:1px solid var(--border);
    position:sticky; top:73px;
  }
  @media (max-width:860px){ .filters{position:static;} }
  .filters-head{
    padding:18px 20px 14px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .filters-head h2{font-size:17px; margin:0; font-weight:600; font-family:'Inter';}
  .filters-body{padding:6px 20px 20px;}
  .field{margin-top:18px;}
  .field label{
    display:block; font-size:13px; font-weight:600; color:var(--navy); margin-bottom:7px;
  }
  .field .hint{font-size:12px; color:var(--steel); margin-top:5px; line-height:1.4;}
  .field input[type="number"], .field select{
    width:100%; padding:9px 10px; border:1px solid var(--border); background:var(--white);
    font-size:14px; font-family:inherit; color:var(--black); border-radius:var(--radius);
  }
  .field input[type="number"]:focus, .field select:focus{
    outline:2px solid var(--blue); outline-offset:1px; border-color:var(--blue);
  }
  .score-row{display:flex; gap:10px;}
  .score-row .field{flex:1; margin-top:0;}
  .reset-btn{
    margin-top:22px; width:100%; padding:10px 12px; background:var(--white);
    border:1px solid var(--navy); color:var(--navy); font-size:13px; font-weight:600; cursor:pointer;
  }
  .reset-btn:hover{background:var(--blue-tint);}

  /* ===== Results ===== */
  .results-head{
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; gap:12px; flex-wrap:wrap;
  }
  .results-head .count{font-size:14px; color:var(--steel);}
  .results-head .count strong{color:var(--black);}
  .sort-field{display:flex; align-items:center; gap:8px; font-size:13px;}
  .sort-field select{
    padding:6px 8px; border:1px solid var(--border); font-size:13px; font-family:inherit; background:var(--white);
  }

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
  @media (max-width:620px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--white); border:1px solid var(--border); border-left:3px solid var(--navy);
    padding:20px; display:flex; flex-direction:column; gap:12px;
  }
  .card:hover{border-left-color:var(--blue);}
  .card-top{display:flex; justify-content:space-between; gap:10px;}
  .card h3{font-size:18px; margin:0; font-weight:500; line-height:1.25;}
  .card .place{font-size:13px; color:var(--steel); margin-top:4px;}
  .badge{
    flex-shrink:0; font-size:11px; font-weight:700; color:var(--blue); background:var(--blue-tint);
    padding:4px 8px; white-space:nowrap; height:fit-content;
  }
  .req-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); padding:10px 0;
  }
  .req{text-align:left;}
  .req .k{font-size:11px; color:var(--steel); text-transform:uppercase; letter-spacing:.03em;}
  .req .v{font-size:15px; font-weight:600; color:var(--navy); font-family:'Fraunces',serif;}
  .tags{display:flex; flex-wrap:wrap; gap:6px;}
  .tag{
    font-size:12px; color:var(--navy); border:1px solid var(--border); padding:3px 8px; background:var(--bg);
  }
  .match{
    margin-top:auto; font-size:12.5px; font-weight:600; padding-top:2px;
  }
  .match.ok{color:#0E7C4A;}
  .match.warn{color:#8A5A00;}

  .empty{
    padding:60px 20px; text-align:center; border:1px dashed var(--border); background:var(--white);
  }
  .empty h3{margin:0 0 8px; font-weight:500;}
  .empty p{color:var(--steel); font-size:14px; margin:0;}

  footer{
    border-top:1px solid var(--border); padding:24px; text-align:center; font-size:12.5px; color:var(--steel);
  }
  footer .ig-link{
    display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; text-decoration:none; font-size:13px;
  }
  footer .ig-link:hover{ text-decoration:underline; }
  footer .footer-meta{
    margin-top:10px; font-size:12px; color:var(--steel);
  }
  footer .footer-meta a{ color:var(--steel); text-decoration:underline; }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }
</style>
</head>
<body>

let lang = "ru";

/* ================= INIT SELECTS ================= */
function fillSelect(sel, keys, dict, anyKey){
  sel.innerHTML = "";
  const optAny = document.createElement("option");
  optAny.value = ""; optAny.textContent = T[lang][anyKey];
  sel.appendChild(optAny);
  keys.forEach(k=>{
    const o = document.createElement("option");
    o.value = k; o.textContent = dict[k];
    sel.appendChild(o);
  });
}

function refreshSelectLabels(){
  fillSelect(document.getElementById("fRegion"), REGIONS, T[lang].region, "anyRegion");
  fillSelect(document.getElementById("fCountry"), COUNTRIES, T[lang].country, "anyCountry");
  fillSelect(document.getElementById("fDirection"), DIRECTIONS, T[lang].direction, "anyDirection");
}

/* ================= RENDER TEXT ================= */
function applyStaticText(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(T[lang][key] !== undefined) el.textContent = T[lang][key];
  });
  document.documentElement.lang = lang;
  document.getElementById("statUnis").textContent = UNIS.length;
  document.getElementById("statCountries").textContent = COUNTRIES.length;
  document.getElementById("statDirections").textContent = DIRECTIONS.length;
}

/* ================= FILTER + RENDER CARDS ================= */
function currentFilters(){
  return {
    ielts: parseFloat(document.getElementById("fIelts").value) || null,
    toefl: parseFloat(document.getElementById("fToefl").value) || null,
    sat: parseFloat(document.getElementById("fSat").value) || null,
    region: document.getElementById("fRegion").value,
    country: document.getElementById("fCountry").value,
    direction: document.getElementById("fDirection").value,
  };
}

function matchesFilters(u, f){
  if(f.region && u.region !== f.region) return false;
  if(f.country && u.country !== f.country) return false;
  if(f.direction && !u.dirs.includes(f.direction)) return false;
  if(f.ielts !== null && u.ielts !== null && u.ielts > f.ielts) return false;
  if(f.toefl !== null && u.toefl !== null && u.toefl > f.toefl) return false;
  if(f.sat !== null && u.sat !== null && u.sat > f.sat) return false;
  return true;
}

function scoreProvided(f){
  return f.ielts !== null || f.toefl !== null || f.sat !== null;
}

function renderCards(){
  const f = currentFilters();
  const list = UNIS.filter(u=>matchesFilters(u,f));
  const grid = document.getElementById("grid");
  const empty = document.getElementById("emptyState");
  grid.innerHTML = "";
  document.getElementById("countNum").textContent = list.length;

  if(list.length === 0){
    grid.style.display = "none";
    empty.style.display = "block";
    return;
  }
  grid.style.display = "grid";
  empty.style.display = "none";

  const hasScores = scoreProvided(f);

  list.forEach(u=>{
    const card = document.createElement("div");
    card.className = "card";

    const top = document.createElement("div");
    top.className = "card-top";
    const nameWrap = document.createElement("div");
    const h3 = document.createElement("h3");
    h3.textContent = u.name[lang];
    const place = document.createElement("div");
    place.className = "place";
    place.textContent = u.city[lang] + " · " + T[lang].country[u.country];
    nameWrap.appendChild(h3); nameWrap.appendChild(place);
    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = T[lang].region[u.region];
    top.appendChild(nameWrap); top.appendChild(badge);

    const reqGrid = document.createElement("div");
    reqGrid.className = "req-grid";
    reqGrid.appendChild(reqCell(T[lang].reqIelts, u.ielts!==null? u.ielts.toFixed(1): T[lang].none));
    reqGrid.appendChild(reqCell(T[lang].reqToefl, u.toefl!==null? u.toefl: T[lang].none));
    reqGrid.appendChild(reqCell(T[lang].reqSat, u.sat!==null? u.sat: T[lang].none));

    const tags = document.createElement("div");
    tags.className = "tags";
    u.dirs.forEach(d=>{
      const t = document.createElement("span");
      t.className = "tag";
      t.textContent = T[lang].direction[d];
      tags.appendChild(t);
    });

    const match = document.createElement("div");
    match.className = "match " + (hasScores ? "ok" : "warn");
    match.textContent = hasScores ? T[lang].matchOk : T[lang].matchWarn;

    card.appendChild(top);
    card.appendChild(reqGrid);
    card.appendChild(tags);
    card.appendChild(match);
    grid.appendChild(card);
  });
}

function reqCell(label, value){
  const wrap = document.createElement("div");
  wrap.className = "req";
  const k = document.createElement("div"); k.className="k"; k.textContent = label;
  const v = document.createElement("div"); v.className="v"; v.textContent = value;
  wrap.appendChild(k); wrap.appendChild(v);
  return wrap;
}

/* ================= EVENTS ================= */
document.querySelectorAll(".lang-switch button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    lang = btn.getAttribute("data-lang");
    document.querySelectorAll(".lang-switch button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    refreshSelectLabels();
    applyStaticText();
    renderCards();
  });
});

["fIelts","fToefl","fSat","fRegion","fCountry","fDirection"].forEach(id=>{
  document.getElementById(id).addEventListener("input", renderCards);
});

document.getElementById("resetBtn").addEventListener("click", ()=>{
  document.getElementById("fIelts").value = "";
  document.getElementById("fToefl").value = "";
  document.getElementById("fSat").value = "";
  document.getElementById("fRegion").value = "";
  document.getElementById("fCountry").value = "";
  document.getElementById("fDirection").value = "";
  renderCards();
});

/* ================= START ================= */
refreshSelectLabels();
applyStaticText();
renderCards();
</script>
